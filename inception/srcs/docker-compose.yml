volumes:
  mariadb_vlm:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/rabounou/data/mariadb

  wordpress_vlm:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/rabounou/data/wordpress

  portainer_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/rabounou/data/portainer

secrets:
  db_user_pass:
    file: ${MARIADB_USER_PASS_FILE}
  db_root_pass:
    file: ${MARIADB_ROOT_PASS_FILE}
  wp_admin_pass:
    file: ${WP_ADMIN_PASS_FILE}
  wp_user_pass:
    file: ${WP_USER_PASS_FILE}

networks:
  docker-network:
    driver: bridge
    name: docker-network